<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Joyeux anniversaire Talia 🎂</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:40px 20px;
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  opacity:0.8;
}

#galerie{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.photo-card{
  background:#111;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(255,255,255,0.08);
  transition:0.3s;
}

.photo-card:hover{
  transform:translateY(-5px);
}

.photo-card img{
  width:100%;
  display:block;
}

.photo-info{
  padding:15px;
}

.photo-info h3{
  font-size:22px;
  margin-bottom:8px;
}

.photo-info p{
  opacity:0.8;
  line-height:1.4;
}

.loader{
  text-align:center;
  padding:50px;
  font-size:22px;
}

</style>
</head>

<body>

<header>
  <h1>🎂 Galerie Anniversaire 🎂</h1>
  <p>Les souvenirs de la soirée ✨</p>
</header>

<div id="galerie">
  <div class="loader">
    Chargement des photos...
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCUDijnOQ7wh7kvSyuXw0iMybZDH1agRU0",
  authDomain: "talilaniversaire.firebaseapp.com",
  databaseURL: "https://talilaniversaire-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "talilaniversaire",
  storageBucket: "talilaniversaire.firebasestorage.app",
  messagingSenderId: "770459220517",
  appId: "1:770459220517:web:f6cb6fafbecddde9771dcc"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function chargerGalerie(){

  const galerie = document.getElementById("galerie");

  db.ref("galerie-pub").on("value", (snapshot)=>{

    galerie.innerHTML = "";

    const data = snapshot.val();

    if(!data){
      galerie.innerHTML = `
        <div class="loader">
          Aucune photo 😢
        </div>
      `;
      return;
    }

    const items = Object.values(data);

    items.reverse().forEach((it)=>{

      if(!it.file || !it.file.data) return;

      galerie.innerHTML += `
        <div class="photo-card">

          <img src="${it.file.data}" alt="photo">

          <div class="photo-info">
            <h3>${it.name || "Invité"}</h3>
            <p>${it.msg || ""}</p>
          </div>

        </div>
      `;
    });

  });

}

chargerGalerie();

</script>

</body>
</html>
