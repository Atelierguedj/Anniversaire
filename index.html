<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Anniversaire Talia 🎂</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:40px 20px;
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  opacity:0.7;
}

.upload-box{
  width:90%;
  max-width:500px;
  margin:20px auto;
  background:#111;
  padding:20px;
  border-radius:25px;
}

.upload-box input,
.upload-box textarea{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#1b1b1b;
  color:white;
}

.upload-box button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:15px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

#galerie{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.photo-card{
  background:#111;
  border-radius:25px;
  overflow:hidden;
}

.photo-card img{
  width:100%;
  display:block;
}

.photo-info{
  padding:15px;
}

.photo-info h3{
  margin-bottom:8px;
}

.photo-info p{
  opacity:0.7;
}

.loader{
  text-align:center;
  padding:50px;
}

</style>

</head>

<body>

<header>
  <h1>🎂 Joyeux anniversaire Talia 🎂</h1>
  <p>Ajoute tes photos et souvenirs ✨</p>
</header>

<div class="upload-box">

  <input type="text" id="name" placeholder="Ton prénom">

  <textarea id="msg" placeholder="Ton message"></textarea>

  <input type="file" id="photo" accept="image/*">

  <button onclick="uploadPhoto()">
    Envoyer la photo 📸
  </button>

</div>

<div id="galerie">
  <div class="loader">
    Chargement...
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCUDijnOQ7wh7kvSyuXw0iMybZDH1agRU0",
  authDomain: "talilaniversaire.firebaseapp.com",
  databaseURL: "https://talilaniversaire-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "talilaniversaire",
  storageBucket: "talilaniversaire.firebasestorage.app",
  messagingSenderId: "770459220517",
  appId: "1:770459220517:web:f6cb6fafbecddde9771dcc"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

function uploadPhoto(){

  const file = document.getElementById("photo").files[0];
  const name = document.getElementById("name").value;
  const msg = document.getElementById("msg").value;

  if(!file){
    alert("Choisis une photo 😭");
    return;
  }

  const storageRef = storage.ref(
    "photos/" + Date.now() + "_" + file.name
  );

  storageRef.put(file).then((snapshot)=>{

    snapshot.ref.getDownloadURL().then((url)=>{

      db.ref("galerie-pub").push({
        image:url,
        name:name,
        msg:msg,
        createdAt:Date.now()
      });

      alert("Photo envoyée 🎉");

      document.getElementById("name").value = "";
      document.getElementById("msg").value = "";
      document.getElementById("photo").value = "";

    });

  });

}

function chargerGalerie(){

  const galerie = document.getElementById("galerie");

  db.ref("galerie-pub").on("value",(snapshot)=>{

    galerie.innerHTML = "";

    const data = snapshot.val();

    if(!data){
      galerie.innerHTML = `
        <div class="loader">
          Aucune photo 😢
        </div>
      `;
      return;
    }

    const items = Object.values(data);

    items.reverse().forEach((it)=>{

      if(!it.image) return;

      galerie.innerHTML += `
        <div class="photo-card">

          <img src="${it.image}">

          <div class="photo-info">
            <h3>${it.name || "Invité"}</h3>
            <p>${it.msg || ""}</p>
          </div>

        </div>
      `;

    });

  });

}

chargerGalerie();

</script>

</body>
</html>
