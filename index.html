<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCUDijnOQ7wh7kvSyuXw0iMybZDH1agRU0",
  authDomain: "talilaniversaire.firebaseapp.com",
  databaseURL: "https://talilaniversaire-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "talilaniversaire",
  storageBucket: "talilaniversaire.firebasestorage.app",
  messagingSenderId: "770459220517",
  appId: "1:770459220517:web:f6cb6fafbecddde9771dcc"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const storage = firebase.storage();

function fbGet(path, cb){
  db.ref(path).on("value", (snapshot)=>{
    cb(Object.values(snapshot.val() || {}));
  });
}

function fbPush(path, data){
  db.ref(path).push(data);
}

function renderPubPhotos(){

  const gallery = document.getElementById('pubGallery');

  if(!gallery) return;

  fbGet('galerie-pub', function(items){

    gallery.innerHTML = '';

    items.reverse().forEach(function(it){

      let img = '';

      if(it.image){
        img = it.image;
      }
      else if(it.file && it.file.data){
        img = it.file.data;
      }

      if(!img) return;

      gallery.innerHTML += `
        <div class="card fadeInUp">

          <img src="${img}" class="photo">

          <div class="cardContent">
            <div class="name">
              ${it.name || 'Invité'}
            </div>

            <div class="msg">
              ${it.msg || ''}
            </div>
          </div>

        </div>
      `;
    });

  });

}

window.addEventListener('load', function(){

  renderPubPhotos();

});

</script>
