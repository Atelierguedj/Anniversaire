<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anniversaire Talia 🎉</title>

  <style>

    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial, sans-serif;
    }

    h1{
      text-align:center;
      padding:20px;
      font-size:32px;
    }

    #galerie{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:20px;
    }

    .photo-card{
      background:#1c1c1c;
      border-radius:20px;
      overflow:hidden;
    }

    .photo-card img{
      width:100%;
      display:block;
    }

    .photo-info{
      padding:10px;
    }

  </style>

</head>

<body>

<h1>🎂 Galerie Anniversaire 🎂</h1>

<div id="galerie"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCUDijnOQ7wh7kvSyuXw0iMybZDH1agRU0",
  authDomain: "talilaniversaire.firebaseapp.com",
  databaseURL: "https://talilaniversaire-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "talilaniversaire",
  storageBucket: "talilaniversaire.firebasestorage.app",
  messagingSenderId: "770459220517",
  appId: "1:770459220517:web:f6cb6fafbecddde9771dcc"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function renderPubPhotos(){

  const galerie = document.getElementById("galerie");

  db.ref("galerie-pub").on("value", (snapshot)=>{

    galerie.innerHTML = "";

    const data = snapshot.val();

    if(!data){
      galerie.innerHTML = "<p>Aucune photo 😢</p>";
      return;
    }

    const items = Object.values(data);

    items.reverse().forEach((it)=>{

      if(!it.file || !it.file.data) return;

      galerie.innerHTML += `
        <div class="photo-card">

          <img src="${it.file.data}">

          <div class="photo-info">
            <h3>${it.name || "Invité"}</h3>
            <p>${it.msg || ""}</p>
          </div>

        </div>
      `;
    });

  });

}

renderPubPhotos();

</script>

</body>
</html>
